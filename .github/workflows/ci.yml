name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: тесты и бандл
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # У пакета нет зависимостей: ставить нечего, поэтому без npm ci.
      - name: Пересобрать бандл и проверить, что он не отстал от src
        run: |
          npm run build
          git diff --exit-code -- lib/client.js

      - name: Тесты
        run: npm test
