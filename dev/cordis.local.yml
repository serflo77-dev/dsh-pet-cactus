# ============================================================================
# dsh-pet-cactus — локальный overlay для разработки
# ============================================================================
#
# Подключает плагин из папки, не трогая профиль и package.json:
#
#   dsh --profile desktop --patch <путь-к-плагину>/dev/cordis.local.yml
#
# Проверка без запуска приложения:
#
#   dsh --profile desktop --patch <этот файл> --dump-config
#
# Путь в name — абсолютный, к точке входа host-половины: так DSH грузит
# плагин прямо из исходников. Перед использованием замените <путь-к-плагину>
# на свой (в Windows — с прямыми слешами или удвоенными обратными).
# Для публикации этот файл не нужен — там работает cordis.patch.yml
# с именем пакета.
# ============================================================================

- insert:
    - id: dsh-pet-cactus-dev
      name: '<путь-к-плагину>/lib/index.js'
