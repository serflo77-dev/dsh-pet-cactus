# ============================================================================
# dsh-pet-cactus — bundle patch
# ============================================================================
#
# Что это:
#   Слой конфигурации DSH, который добавляет одну строку-плагин: кактуса.
#   Файл читается при старте приложения; host-половина живёт в lib/index.js,
#   браузерная — отдаётся плагином как /plugins/dsh-pet-cactus/client.js.
#
# Правила, которые нельзя нарушать:
#   - id строки глобально уникален и совпадает с именем пакета: по id идёт
#     сопоставление записи в профиле, чужой id ломает установку;
#   - name ссылается на имя пакета (разрешается в lib/index.js по exports);
#   - строка не содержит хвостовых комментариев: парсер ждёт чистое «id: value».
#
# Настройки не задаются здесь: они лежат в
#   <DSH_HOME>/dsh-pet-cactus/main-config.json
# и меняются через PUT /dsh-pet-cactus/api/config или вручную.
# ============================================================================

- insert:
    - id: dsh-pet-cactus
      name: 'dsh-pet-cactus'
